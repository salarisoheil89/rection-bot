services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: reactbot
      POSTGRES_USER: reactbot
      POSTGRES_PASSWORD: change_me
    volumes: [postgres_data:/var/lib/postgresql/data]
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on: [db]
volumes:
  postgres_data:
